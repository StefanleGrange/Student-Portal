<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .profile-card { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .msg { display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2 id="profileHeader">Loading...</h2>
        <hr>
        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>

        <div id="successMsg" class="msg alert alert-success">Profile updated successfully!</div>
        <div id="errorMsg" class="msg alert alert-danger">Error updating profile.</div>
        
        <button id="logoutBtn" class="btn btn-danger w-100 mt-3">Logout</button>
    </div>
    <script src="/frontend/Js/dashboard.js"></script>
</body>
</html>
